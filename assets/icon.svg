<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PharmaFlow Bio">
  <!-- spec 009 FR-006: 앱·슬랙 아이콘. 파랑 → 청록 → 초록 바탕, 가운데 큰 바이알과 그 둘레를 감는 RNA 가닥(염기 A·U·G·C 네 색).
       RNA 좌표는 사인 곡선으로 계산해 넣었다 (가운데 부분은 바이알 뒤로 지나감) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0a2a78"/>
      <stop offset="0.5" stop-color="#0b5f8a"/>
      <stop offset="0.8" stop-color="#0f8a7a"/>
      <stop offset="1" stop-color="#3ee0a8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.48" r="0.5">
      <stop offset="0" stop-color="#7fe9ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7fe9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.82" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8af5ff"/>
      <stop offset="1" stop-color="#1fbf9f"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b9bb0"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7a8aa0"/>
    </linearGradient>
    <linearGradient id="rna" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6cc8ff"/>
      <stop offset="1" stop-color="#8affcf"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#021a3a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="246" r="200" fill="url(#halo)"/>

