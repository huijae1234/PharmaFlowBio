    <line x1="356.0" y1="263.8" x2="360.7" y2="293.4" stroke="#b5ff8a" stroke-width="11" stroke-linecap="round" opacity="1"/>
    <circle cx="360.7" cy="293.4" r="8" fill="#b5ff8a" opacity="1"/>
    <line x1="382.6" y1="252.0" x2="401.9" y2="274.9" stroke="#ffd166" stroke-width="11" stroke-linecap="round" opacity="1"/>
    <circle cx="401.9" cy="274.9" r="8" fill="#ffd166" opacity="1"/>
